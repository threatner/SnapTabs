<svg xmlns="http://www.w3.org/2000/svg" width="440" height="280" viewBox="0 0 440 280">
  <!--
    Layout: 112px icon at x=36, text column from x=172. Three lines only,
    large enough to read at half size in search results.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="440" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="136" y2="136" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="130" cy="140" r="170" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="440" height="280" fill="url(#bg)"/>
  <rect width="440" height="280" fill="url(#glow)"/>

  <!-- Search-result card (D17): icon, name and one short promise, nothing
       else, so it still reads at half size (the store shows it small). -->
  <g transform="translate(36, 84)">
    <rect width="112" height="112" rx="26" fill="url(#iconGrad)"/>
    <g transform="translate(23, 23) scale(2.75)" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M4 7V4h16v3"/>
      <path d="M9 20h6"/>
      <path d="M12 4v16"/>
      <rect x="2" y="7" width="20" height="7" rx="1"/>
    </g>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="172" y="122" font-size="40" font-weight="700" fill="#ffffff" letter-spacing="-1">SnapTabs</text>
    <text x="172" y="162" font-size="25" font-weight="600" fill="#e2e8f0">Save tabs.</text>
    <text x="172" y="194" font-size="25" font-weight="600" fill="#93c5fd">Restore later.</text>
  </g>
</svg>
